name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_parser_tests:
        description: Run Docling and RapidOCR parser integration tests (downloads models on first use)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      - name: Verify Go modules
        run: go mod verify

      - name: Run backend tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build backend
        run: go build -o /tmp/qavor-api ./cmd/server

      - name: Set up Python for lightweight document parser tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pkg/documentparser/python/constraints.txt
            pkg/documentparser/python/requirements-test.txt

      - name: Install lightweight document parser test dependencies
        run: python -m pip install -c pkg/documentparser/python/constraints.txt -r pkg/documentparser/python/requirements-test.txt

      - name: Run lightweight document parser tests
        run: python -m unittest discover -s pkg/documentparser/python -p "test_*.py" -v

  document-parser-real:
    name: Document parser real integration (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_parser_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pkg/documentparser/python/constraints.txt
            pkg/documentparser/python/requirements.txt
            pkg/documentparser/python/requirements-test.txt

      - name: Install real document parser dependencies
        run: python -m pip install -c pkg/documentparser/python/constraints.txt -r pkg/documentparser/python/requirements.txt -r pkg/documentparser/python/requirements-test.txt

      - name: Run real document parser integration tests
        env:
          QAVOR_REAL_PARSER_TESTS: '1'
        run: python -m unittest discover -s pkg/documentparser/python -p "test_*.py" -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test:unit

      - name: Report frontend lint issues
        continue-on-error: true
        run: pnpm exec eslint .

      - name: Build frontend
        run: pnpm build
