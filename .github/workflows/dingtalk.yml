name: DingTalk Notify

on:
  push:
    branches:
      - main
      - master
      - develop
      - test

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send DingTalk
        env:
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          curl -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            --data '{"msgtype":"text","text":{"content":"GitHub测试"}}'