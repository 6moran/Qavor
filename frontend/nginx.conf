# ============================================================
# Qavor Frontend Nginx 配置
#   - 托管 Vue SPA 静态文件
#   - 反向代理 /api → 后端 qavor-api:8080
# ============================================================

server {
    listen       80;
    server_name  _;

    # 前端静态资源
    root   /usr/share/nginx/html;
    index  index.html;

    # SPA 路由：所有非文件请求 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 禁止缓存：发新版后浏览器必须拿最新的（里面引用的 js/css 文件名带 hash）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 静态资源缓存（带 hash 的文件名，可长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 反向代理 API 请求到后端
    # qavor-api 是 docker-compose 里的服务名
    location /api/ {
        proxy_pass http://qavor-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应：关闭缓冲，保持长连接
        proxy_buffering off;
        proxy_cache off;
        # HTTP/1.1 + 空 Connection 头：SSE/长连接必需，避免连接被提前断开
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
