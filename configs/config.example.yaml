# 应用配置
app:
  name: "qavor-api"
  version: "1.0.0"
  mode: "debug"  # debug, release, test
  port: 8080

auth:
  admin_username: "change-me"
  admin_password: "change-me"

# 数据库配置
database:
  # mysql（暂不使用，保留供后续切换）
  # mysql:
  #   host: "39.105.40.22"
  #   port: 3306
  #   username: "root"
  #   password: ""
  #   database: "qavor"
  #   max_idle_conns: 10
  #   max_open_conns: 100
  auto_migrate: false  # 是否自动迁移数据库，设为 false 可跳过每次启动时的迁移
  redis:
    host: "39.105.40.22"
    port: 6379
    password: ""                              # 通过环境变量 REDIS_PASSWORD 覆盖
    db: 0
    pool_size: 10
  postgres:
    host: "39.105.40.22"
    port: 5432
    username: "postgres"
    password: ""                              # 通过环境变量 POSTGRES_PASSWORD 覆盖
    database: "qavor"
    sslmode: "disable"
    max_idle_conns: 10
    max_open_conns: 100
  minio:
    endpoint: "39.105.40.22:9000"
    access_key: ""                            # 通过环境变量 MINIO_ACCESS_KEY 覆盖
    secret_key: ""                            # 通过环境变量 MINIO_SECRET_KEY 覆盖
    bucket: "qavor"
    use_ssl: false
    region: ""

# JWT 配置
jwt:
  secret: "your-jwt-secret-key-change-in-production"  # JWT 密钥，生产环境请修改
  access_expire: 2                                     # 访问令牌过期时间（小时）
  refresh_expire: 168                                  # 刷新令牌过期时间（小时），7天

# 日志配置
log:
  level: "debug"  # debug, info, warn, error
  filename: "logs/app.log"
  max_size: 100    # MB
  max_backups: 3   # 保留旧文件的最大个数
  max_age: 28      # 保留旧文件的最大天数
  compress: true   # 是否压缩

# CORS 配置
cors:
  enabled: true
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"

# 邮件配置
# SMTP 服务器配置说明：
# - QQ 邮箱：smtp.qq.com，端口 465（SSL）或 587（STARTTLS）
# - 163 邮箱：smtp.163.com，端口 465（SSL）
# - Gmail：smtp.gmail.com，端口 465（SSL）或 587（STARTTLS）
# - 授权码获取方式：登录邮箱后，在设置 -> 账户 -> POP3/SMTP 服务中开启并获取授权码
email:
  smtp:
    host: "smtp.qq.com"                       # SMTP 服务器地址
    port: 465                                 # SMTP 端口（SSL）
    account: ""                               # 邮箱账号（如：your-email@qq.com）
    auth_code: ""                             # 邮箱授权码（非登录密码），通过环境变量 EMAIL_AUTH_CODE 覆盖
  from: ""                                    # 发件人邮箱（通常与 account 相同）
  from_name: "Qavor"                          # 发件人名称

# LLM 配置
llm:
  model: "gpt-4o"                             # 模型名称
  api_key: ""                                 # API 密钥（通过环境变量 LLM_API_KEY 覆盖）
  base_url: ""                                # API 基础地址（可选，OpenAI 默认使用官方地址）
  timeout: 60s                                # 请求超时时间
  temperature: 0.7                            # 温度参数 (0-2)
  max_completion_tokens: 2048                 # 最大 token 数（包含推理 token）
  top_p: 1.0                                  # Top P 采样
  stop: []                                    # 停止词
  presence_penalty: 0                         # 存在惩罚 (-2.0 到 2.0)
  frequency_penalty: 0                        # 频率惩罚 (-2.0 到 2.0)
  seed: null                                  # 随机种子（用于可重现的结果）
  user: null                                  # 用户标识

# SSE 流式服务配置
sse:
  max_stream_time: 300                        # 单次流式最大时长（秒），默认 300（5分钟）
  heartbeat_interval: 15                      # 心跳间隔（秒），默认 15
  max_concurrent_tasks: 5                     # 单用户最大并发任务数，默认 5
